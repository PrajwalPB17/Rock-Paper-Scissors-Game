<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>✊ Rock Paper Scissors ✋</h1>

        <div class="scoreboard">

            <div>
                <h2>You</h2>
                <p id="userScore">0</p>
            </div>

            <div>
                <h2>Computer</h2>
                <p id="cpuScore">0</p>
            </div>

        </div>

        <div class="choices">

            <button onclick="play('rock')">
🪨<br>Rock
</button>

            <button onclick="play('paper')">
📄<br>Paper
</button>

            <button onclick="play('scissors')">
✂️<br>Scissors
</button>

        </div>

        <div class="result">

            <p id="userChoice"></p>

            <p id="cpuChoice"></p>

            <h2 id="winner"></h2>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
